<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1910 Contour Survey</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="map"></div>
    <aside class="panel">
        <h1>Contour Survey of the Site for the Federal Capital, 1910</h1>
        <label class="row">
            <span>Opacity</span>
            <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.85">
        </label>
        <label class="row"><input id="grid" type="checkbox" checked> 1910 grid (2,500 ft, from Ainslie)</label>
        <label class="row"><input id="sheets" type="checkbox"> Sheet outlines</label>
        <label class="row"><input id="stations" type="checkbox" checked> Control stations</label>
        <h2>1912 competition plans</h2>
        <label class="row">
            <span>Opacity</span>
            <input id="plan-opacity" type="range" min="0" max="1" step="0.05" value="0.8">
        </label>
        <div id="plan-layers" class="plan-list"></div>
        <h2>Streets traced from the plans</h2>
        <p class="note">Automatic first drafts (<code>vectorise.py</code>), not yet checked by hand. Click a street for its width.</p>
        <div id="street-layers" class="plan-list"></div>
        <h2>Aerial photos beneath</h2>
        <div id="hapmap-layers"></div>
        <p class="note">Press <kbd>Space</kbd> to flick the 1910 map on and off.</p>
    </aside>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
