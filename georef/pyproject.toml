[project]
name = "georef-1910"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "rasterio>=1.4.4",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "shapely>=2.2.0",
    "skan>=0.13.1",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "C4", "PIE", "RET"]
# zip() over arrays built to the same length; strict= would only add noise.
ignore = ["B905"]
